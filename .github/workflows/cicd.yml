name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Each architecture pushes by digest under no tag at all. The mutable :arm
  # and :amd tags this replaced were shared across runs, so two pushes landing
  # close together could interleave and leave :latest with its arm64 half from
  # one commit and its amd64 half from another — undetected, and :latest is
  # what the server pulls.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd
            platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Serialize publication and check main after acquiring the lock so a slower,
  # older build cannot replace :latest. Deployment is not automatic: the
  # pocketdeploy-v2 host pins this image by digest for its four redirect hosts.
  publish:
    runs-on: ubuntu-24.04-arm
    needs:
      - build
    concurrency:
      group: publish-colors-redirect
      cancel-in-progress: false
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Check that this is the current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_SHA" = "$main_sha" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping publication: this run is not the current main commit."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push the manifest list
        if: steps.current.outputs.publish == 'true'
        working-directory: /tmp/digests
        run: |
          sources=()
          for digest in *; do
            sources+=("ghcr.io/$GITHUB_REPOSITORY@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:latest \
            --tag ghcr.io/${{ github.repository }}:sha-${{ steps.sha.outputs.short }} \
            "${sources[@]}"

      - name: Show what was published
        if: steps.current.outputs.publish == 'true'
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:latest
