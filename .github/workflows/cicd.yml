name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Each architecture pushes by digest under no tag at all. The mutable :arm
  # and :amd tags this replaced were shared across runs, so two pushes landing
  # close together could interleave and leave :latest with its arm64 half from
  # one commit and its amd64 half from another — undetected, and :latest is
  # what the server pulls.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd
            platform: linux/amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Hold the same lock from publication through deployment so another run
  # cannot replace :latest while this run is deploying. Check main after
  # acquiring the lock to prevent a slower, older build rolling production back.
  publish-deploy:
    runs-on: ubuntu-24.04-arm
    needs:
      - build
    environment:
      name: once-colors
      url: https://getcolors.ai
    concurrency:
      group: deploy-once-colors
      cancel-in-progress: false
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Check that this is the current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_SHA" = "$main_sha" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping publication and deployment: this run is not the current main commit."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push the manifest list
        if: steps.current.outputs.publish == 'true'
        working-directory: /tmp/digests
        run: |
          sources=()
          for digest in *; do
            sources+=("ghcr.io/$GITHUB_REPOSITORY@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:latest \
            --tag ghcr.io/${{ github.repository }}:sha-${{ steps.sha.outputs.short }} \
            "${sources[@]}"

      - name: Show what was published
        if: steps.current.outputs.publish == 'true'
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:latest
      - name: Deploy via SSH
        if: steps.current.outputs.publish == 'true'
        env:
          # Only the key is a secret. The address and user are variables, so CI
          # logs stay readable — DNS reveals the address anyway.
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ vars.SERVER_IP }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
        run: |
          # Create the .ssh directory and start the agent
          mkdir -p ~/.ssh
          eval "$(ssh-agent -s)"

          # Add the private key to the agent
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -

          # Pinned by ONCE at provisioning time, not scanned here. Fail closed:
          # falling back to ssh-keyscan would trust whatever answers on that
          # address, which is the weakness this replaced.
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "SSH_KNOWN_HOSTS is unset - run 'once create' to publish it" >&2
            exit 1
          fi
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts

          # A ping, not a command. This key's authorized_keys entry already
          # names every host this repository serves, and its forced command
          # updates all of them — so there is no hostname to duplicate here,
          # and adding a host to colors.yml needs no change to this file.
          #
          # Connect to SERVER_IP: ONCE keys the pinned SSH_KNOWN_HOSTS entry on
          # the address, so a hostname here would find no match under
          # StrictHostKeyChecking=yes.
          #
          # The exit status is the deploy result for every host this key owns.
          ssh -T -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_IP" < /dev/null
